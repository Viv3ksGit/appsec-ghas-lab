# SBOM + signed build provenance (SLSA Build L2-style) using GitHub artifact attestations.
# Verify locally with:  gh attestation verify dist/app.tar.gz -R <owner>/appsec-ghas-lab
name: Supply chain (SBOM + provenance)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore keyless signing via OIDC
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build artifact
        run: |
          mkdir -p dist
          tar -czf dist/app.tar.gz app/

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: app/
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/app.tar.gz

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/app.tar.gz
          sbom-path: dist/sbom.spdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
