version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    cooldown:          # don't adopt brand-new releases (malicious-publish window)
      default-days: 7
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # Keeps SHA-pinned actions current (Dependabot updates the SHA + the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:          # don't adopt brand-new releases (malicious-publish window)
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:          # don't adopt brand-new releases (malicious-publish window)
      default-days: 7

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    cooldown:          # don't adopt brand-new releases (malicious-publish window)
      default-days: 7
